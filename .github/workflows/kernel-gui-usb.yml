name: Build kernel then Fedora Xfce GUI USB image

on:
  workflow_dispatch:
    inputs:
      linux_next_ref:
        description: linux-next branch/tag/commit to build
        required: false
        default: master

permissions:
  contents: read
  actions: read

jobs:
  kernel:
    uses: ./.github/workflows/nightly.yml
    with:
      linux_next_ref: ${{ inputs.linux_next_ref || 'master' }}

  image:
    needs: kernel
    uses: ./.github/workflows/gui-usb.yml
    with:
      use_current_run_kernel: true
