name: Build Fedora Xfce GUI USB image

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: Optional successful kernel run ID; blank builds a new kernel first
        required: false
      linux_next_ref:
        description: linux-next branch/tag/commit to build when kernel run ID is blank
        required: false
        default: master

permissions:
  contents: read
  actions: read

jobs:
  kernel:
    if: inputs.kernel_run_id == ''
    uses: ./.github/workflows/nightly.yml
    with:
      linux_next_ref: ${{ inputs.linux_next_ref || 'master' }}

  image:
    needs: kernel
    if: always() && (needs.kernel.result == 'success' || needs.kernel.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk for the raw USB image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd pv rpm2cpio cpio kmod
      - name: Download newly built kernel bundle
        if: inputs.kernel_run_id == ''
        uses: actions/download-artifact@v4
        with:
          pattern: zenbook-a16-linux-next-*
          path: kernel-artifact
          merge-multiple: true
      - name: Download requested existing kernel bundle
        if: inputs.kernel_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ inputs.kernel_run_id }}
        run: |
          gh run download "$REQUESTED_RUN" --repo "$GITHUB_REPOSITORY" --dir kernel-artifact
      - name: Find latest Fedora Xfce ARM64 raw image
        id: fedora
        run: |
          base=https://dl.fedoraproject.org/pub/fedora/linux/development/rawhide/Spins/aarch64/images
          image=$(curl -fsSL "$base/" | grep -oE 'Fedora-Xfce-Disk-Rawhide-[0-9]{8}\.n\.[0-9]+\.aarch64\.raw\.xz' | sort -Vu | tail -n1)
          test -n "$image"
          echo "url=$base/$image" >> "$GITHUB_OUTPUT"
      - name: Create non-default GUI USB image
        run: |
          bundle=$(find kernel-artifact -name 'zenbook-a16-*.tar.zst' -print -quit)
          SPLIT_SIZE=1900m bash scripts/make-fedora-xfce-usb-image.sh "$bundle" "${{ steps.fedora.outputs.url }}"
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-xfce-a16-usb-${{ github.run_number }}
          path: |
            out/fedora-xfce-a16-*.raw.xz.*
          if-no-files-found: error
          retention-days: 7
