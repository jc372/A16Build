name: Build Fedora Xfce GUI USB image

on:
  workflow_call:
    inputs:
      use_current_run_kernel:
        description: Download the kernel artifact produced earlier in this workflow run
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: Optional successful kernel run ID; blank uses the newest one
        required: false

permissions:
  contents: read
  actions: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk for the raw USB image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd pv rpm2cpio cpio kmod
      - name: Download kernel bundle from this workflow run
        if: inputs.use_current_run_kernel
        uses: actions/download-artifact@v4
        with:
          pattern: zenbook-a16-linux-next-*
          path: kernel-artifact
          merge-multiple: true
      - name: Download existing kernel bundle
        if: ${{ !inputs.use_current_run_kernel }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ inputs.kernel_run_id }}
        run: |
          run_id="$REQUESTED_RUN"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow "Nightly ASUS Zenbook A16 kernel" --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$run_id" && test "$run_id" != "null"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --dir kernel-artifact
      - name: Find latest Fedora Xfce ARM64 raw image
        id: fedora
        run: |
          base=https://dl.fedoraproject.org/pub/fedora/linux/development/rawhide/Spins/aarch64/images
          image=$(curl -fsSL "$base/" | grep -oE 'Fedora-Xfce-Disk-Rawhide-[0-9]{8}\.n\.[0-9]+\.aarch64\.raw\.xz' | sort -Vu | tail -n1)
          test -n "$image"
          echo "url=$base/$image" >> "$GITHUB_OUTPUT"
      - name: Create non-default GUI USB image
        run: |
          bundle=$(find kernel-artifact -name 'zenbook-a16-*.tar.zst' -print -quit)
          SPLIT_SIZE=1900m bash scripts/make-fedora-xfce-usb-image.sh "$bundle" "${{ steps.fedora.outputs.url }}"
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-xfce-a16-usb-${{ github.run_number }}
          path: |
            out/fedora-xfce-a16-*.raw.xz.*
          if-no-files-found: error
          retention-days: 7
