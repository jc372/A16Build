# a16-next-grub.cfg -- installed by a16-stage-dt-boot.sh (A16_CFG=...) and by
# a16-install-next-kernel.sh.  Offers, side by side: the 7.2 install as shipped
# (ACPI), the 7.2 install booted from the machine DTB -- which is the combination
# that WORKS TODAY with internal keyboard/touchpad/touchscreen -- and the
# payload's own 7.3.0-rc3-next-20260914 kernel with that same DTB.
#
# STATUS (verified in the boot reports under /boot/efi/a16-reports/):
#   entry [1]  boots with the panel lit from the firmware framebuffer
#              (fb0 simpledrmdrmfb 2880x1800, connector connected) and with
#              11 internal i2c-HID input devices (keyboard 0B05:4B42,
#              touchpad 093A:3012, touchscreen 04F3:4645, ASUSTek 0B05:4543),
#              4 i2c buses (i2c-0/10/13/19) and 11 gpiochips from pinctrl-glymur.
#              No backlight device yet (brightness stays firmware-controlled) and
#              no msm: the display pipeline is deliberately left untouched.
#   entry [0]  is the untouched install under ACPI: always shows a picture, but
#              no internal input at all (no QCOM0F10 in i2c-qcom-geni's ACPI
#              table, no ACPI table in pinctrl-glymur).
#   entries [2]/[3] are the 7.3 attempt, whose DTB/panel/msm drivers come from
#              the same tree as the DTB; [3] is the real display path (msm +
#              panel_samsung_atna33xc20), currently the only way to get a
#              backlight-controlled panel and DP output.
#
# Why the flags: a devicetree boot needs acpi=off (arm64 prefers ACPI whenever
# the firmware offers tables) and the three cleanup-ignore flags, or the kernel
# takes the panel down -- first msm claiming fb0 after a panel-probe failure
# ("gcc_usb3_tert_phy_com_aux_clk status stuck at 'off'", "Failed to enable clk
# 'com_aux': -16"), then the regulator late cleanup cutting the panel rail
# ("VREG_EDP_3P3: disabling").  loglevel=7 + keep_bootcon so a failure is
# readable, and no `quiet splash`.
#
# Next-kernel files (installed by a16-install-next-kernel.sh, ~80 MB + initramfs):
#     /boot/vmlinuz-7.3.0-rc3-next-20260914
#     /boot/initrd.img-7.3.0-rc3-next-20260914     (nvme is a module -> required)
#     /boot/config-7.3.0-rc3-next-20260914
#     /boot/glymur-asus-zenbook-a16-ux3607oa.dtb
#     /lib/modules/7.3.0-rc3-next-20260914/
#     CONFIG_MODULE_SIG_FORCE is not set in that build, so those modules load.
#   Entries [2]/[3] refuse politely ("next-kernel files missing") if these are
#   absent, so this menu is safe to install before the kernel is.
#
# Default is entry [1]: a working machine (panel + internal input).  Change
# `set default=` below to land somewhere else unattended.
#
# Entry [4] exists for hands-on work: msm runs (so the USB3/DP path is exercised
# and logged) but the panel's own PHY driver is blacklisted so nothing resets the
# firmware's eDP link -- if the picture survives, the screen stays usable and the
# failure can be watched live instead of from a report.
set timeout=30
set timeout_style=menu
set default=1

insmod part_gpt
insmod fat
insmod ext2
insmod search_fs_file
insmod sleep
insmod fdt

# Snapdragon boards: Ubuntu's own arm64 config cuts a bogus high window out of
# the memory map before handing memory to the kernel.  (Unchanged.)
insmod smbios
insmod regexp
smbios --type 4 --get-string 5 --set proc_version
regexp "Snapdragon.*" "$proc_version"
if [ "$?" = "0" ]; then
  if [ "$lockdown" != "y" ]; then
    cutmem 0x8800000000 0x8fffffffff
  fi
fi

menuentry "[0] A16: installed Ubuntu 7.2 staged on the ESP (ACPI) - picture, no internal input" {
    search --no-floppy --file --set=a16esp /a16boot/vmlinuz
    if [ -n "$a16esp" ]; then
        set root=$a16esp
        set prefix="$a16esp/a16boot"
        insmod gzio
        linux /a16boot/vmlinuz root=UUID=f8e005e9-414c-4c8e-ad68-d1e9fdc208bc  ro  quiet splash crashkernel=2G-4G:320M,4G-32G:512M,32G-64G:1024M,64G-128G:2048M,128G-:4096M
        initrd /a16boot/initrd.img
        boot
    fi
    echo "  staged ESP payload missing"
    sleep 20
    configfile $prefix/grub.cfg
}

menuentry "[1] A16: 7.2 + glymur DTB, internal input, panel via firmware framebuffer" {
    echo "  prefix=$prefix  cmdpath=$cmdpath"
    echo "  the combination that works today: internal keyboard/touchpad/touchscreen + a picture"
    search --no-floppy --file --set=a16esp /a16boot/vmlinuz
    if [ -z "$a16esp" ]; then
        echo "  /a16boot/vmlinuz is not on any device -- staged payload missing"
    else
        set root=$a16esp
        set prefix="$a16esp/a16boot"
        if [ -f /a16boot/glymur-asus-zenbook-a16-ux3607oa.dtb ]; then
            insmod fdt
            insmod gzio
            linux /a16boot/vmlinuz root=UUID=f8e005e9-414c-4c8e-ad68-d1e9fdc208bc  ro  acpi=off clk_ignore_unused pd_ignore_unused regulator_ignore_unused module_blacklist=msm,dispcc_glymur,gpucc_glymur,videocc_glymur,phy_qcom_edp,panel_samsung_atna33xc20 modprobe.blacklist=msm console=tty0 keep_bootcon loglevel=7 crashkernel=2G-4G:320M,4G-32G:512M,32G-64G:1024M,64G-128G:2048M,128G-:4096M
            devicetree /a16boot/glymur-asus-zenbook-a16-ux3607oa.dtb
            initrd /a16boot/initrd.img
            boot
        else
            echo "  DTB MISSING: /a16boot/glymur-asus-zenbook-a16-ux3607oa.dtb"
            echo "  (run: sudo bash /home/jc/a16-payload/a16-stage-dt-boot.sh)"
        fi
    fi
    echo "  entry 1 did not boot -- back to the menu in 20s"
    sleep 20
    configfile $prefix/grub.cfg
}

menuentry "[2] A16: next 7.3 + glymur DTB, panel left to firmware (msm/display CCs blacklisted)" {
    echo "  prefix=$prefix  cmdpath=$cmdpath"
    echo "  same idea as [1] but with the matching 7.3 tree"
    search --no-floppy --fs-uuid --set=root f8e005e9-414c-4c8e-ad68-d1e9fdc208bc
    if [ -f /boot/vmlinuz-7.3.0-rc3-next-20260914 -a -f /boot/initrd.img-7.3.0-rc3-next-20260914 ]; then
        insmod fdt
        insmod gzio
        linux /boot/vmlinuz-7.3.0-rc3-next-20260914 root=UUID=f8e005e9-414c-4c8e-ad68-d1e9fdc208bc  ro  acpi=off clk_ignore_unused pd_ignore_unused regulator_ignore_unused module_blacklist=msm,dispcc_glymur,gpucc_glymur,videocc_glymur,phy_qcom_edp,panel_samsung_atna33xc20 modprobe.blacklist=msm console=tty0 keep_bootcon loglevel=7 crashkernel=2G-4G:320M,4G-32G:512M,32G-64G:1024M,64G-128G:2048M,128G-:4096M
        devicetree /boot/glymur-asus-zenbook-a16-ux3607oa.dtb
        initrd /boot/initrd.img-7.3.0-rc3-next-20260914
        boot
    fi
    echo "  next-kernel files missing -- run: sudo bash /home/jc/a16-payload/a16-install-next-kernel.sh"
    sleep 20
    configfile $prefix/grub.cfg
}

menuentry "[3] A16: next 7.3 + glymur DTB, full display attempt (msm + panel enabled)" {
    echo "  prefix=$prefix  cmdpath=$cmdpath"
    echo "  the REAL display path: if it lights the panel, brightness and DP work too"
    search --no-floppy --fs-uuid --set=root f8e005e9-414c-4c8e-ad68-d1e9fdc208bc
    if [ -f /boot/vmlinuz-7.3.0-rc3-next-20260914 -a -f /boot/initrd.img-7.3.0-rc3-next-20260914 ]; then
        insmod fdt
        insmod gzio
        linux /boot/vmlinuz-7.3.0-rc3-next-20260914 root=UUID=f8e005e9-414c-4c8e-ad68-d1e9fdc208bc  ro  acpi=off clk_ignore_unused pd_ignore_unused regulator_ignore_unused console=tty0 keep_bootcon loglevel=7 crashkernel=2G-4G:320M,4G-32G:512M,32G-64G:1024M,64G-128G:2048M,128G-:4096M
        devicetree /boot/glymur-asus-zenbook-a16-ux3607oa.dtb
        initrd /boot/initrd.img-7.3.0-rc3-next-20260914
        boot
    fi
    echo "  next-kernel files missing -- run: sudo bash /home/jc/a16-payload/a16-install-next-kernel.sh"
    sleep 20
    configfile $prefix/grub.cfg
}

menuentry "[4] A16: next 7.3 + DTB, msm enabled but panel PHY left unmanaged (keeps a picture, if it holds)" {
    echo "  prefix=$prefix  cmdpath=$cmdpath"
    echo "  exercises the USB3/DP path (the tert combo PHY) while the panel's own PHY"
    echo "  (phy_qcom_edp) has no driver, so nothing resets the firmware's eDP link."
    echo "  If the picture survives, log in normally and run: a16-display-probe.sh"
    search --no-floppy --fs-uuid --set=root f8e005e9-414c-4c8e-ad68-d1e9fdc208bc
    if [ -f /boot/vmlinuz-7.3.0-rc3-next-20260914 -a -f /boot/initrd.img-7.3.0-rc3-next-20260914 ]; then
        insmod fdt
        insmod gzio
        linux /boot/vmlinuz-7.3.0-rc3-next-20260914 root=UUID=f8e005e9-414c-4c8e-ad68-d1e9fdc208bc  ro  acpi=off clk_ignore_unused pd_ignore_unused regulator_ignore_unused module_blacklist=phy_qcom_edp modprobe.blacklist=phy_qcom_edp console=tty0 keep_bootcon loglevel=7 crashkernel=2G-4G:320M,4G-32G:512M,32G-64G:1024M,64G-128G:2048M,128G-:4096M
        devicetree /boot/glymur-asus-zenbook-a16-ux3607oa.dtb
        initrd /boot/initrd.img-7.3.0-rc3-next-20260914
        boot
    fi
    echo "  next-kernel files missing -- run: sudo bash /home/jc/a16-payload/a16-install-next-kernel.sh"
    sleep 20
    configfile $prefix/grub.cfg
}

menuentry "[5] A16: installed Ubuntu - its own generated grub.cfg (normal path)" {
    echo "  prefix=$prefix  cmdpath=$cmdpath"
    search --no-floppy --fs-uuid --set=root f8e005e9-414c-4c8e-ad68-d1e9fdc208bc
    set prefix="($root)/boot/grub"
    configfile $prefix/grub.cfg
    echo "  could not read ($root)/boot/grub/grub.cfg"
}

menuentry "[6] A16: diagnostics - photograph this screen" {
    set pager=0
    echo "  === A16 GRUB diagnostics ==="
    echo "  prefix=$prefix"
    echo "  cmdpath=$cmdpath"
    echo "  platform=$grub_platform  cpu=$grub_cpu"
    search --no-floppy --file --set=a16esp /a16boot/vmlinuz
    echo "  staged ESP payload found on: $a16esp"
    search --no-floppy --fs-uuid --set=r17 f8e005e9-414c-4c8e-ad68-d1e9fdc208bc
    echo "  UUID f8e005e9-414c-4c8e-ad68-d1e9fdc208bc -> $r17"
    echo "  --- staged ESP payload ---"
    ls ($a16esp)/a16boot
    echo "  --- installed root /boot (next kernel) ---"
    if [ -f ($r17)/boot/vmlinuz-7.3.0-rc3-next-20260914 ]; then echo "    vmlinuz-7.3.0-rc3-next-20260914: PRESENT"; else echo "    vmlinuz-7.3.0-rc3-next-20260914: MISSING"; fi
    if [ -f ($r17)/boot/initrd.img-7.3.0-rc3-next-20260914 ]; then echo "    initrd.img-7.3.0-rc3-next-20260914: PRESENT"; else echo "    initrd.img-7.3.0-rc3-next-20260914: MISSING"; fi
    if [ -f ($r17)/boot/glymur-asus-zenbook-a16-ux3607oa.dtb ]; then echo "    glymur DTB: PRESENT"; else echo "    glymur DTB: MISSING"; fi
    if [ -f ($r17)/boot/vmlinuz-7.2.0-5-generic ]; then echo "    vmlinuz-7.2.0-5-generic: PRESENT"; else echo "    vmlinuz-7.2.0-5-generic: MISSING"; fi
    if [ -f ($r17)/boot/initrd.img-7.2.0-5-generic ]; then echo "    initrd.img-7.2.0-5-generic: PRESENT"; else echo "    initrd.img-7.2.0-5-generic: MISSING"; fi
    for m in gzio.mod ext2.mod linux.mod normal.mod fat.mod part_gpt.mod search.mod fdt.mod; do
        if [ -f ($r17)/boot/grub/arm64-efi/$m ]; then echo "    module $m: PRESENT"; else echo "    module $m: MISSING"; fi
    done
    echo "  === end: prefix=$prefix cmdpath=$cmdpath esp=$a16esp root=$r17 ==="
    echo "  (sleeping 90s - photograph now)"
    sleep 90
}

menuentry "[7] Windows Boot Manager" {
    insmod part_gpt
    insmod fat
    insmod chain
    search --no-floppy --file --set=root /EFI/Microsoft/Boot/bootmgfw.efi
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}
