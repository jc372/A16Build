# a16-dt-grub.cfg -- staged by a16-stage-dt-boot.sh
#
# Derived from the a16-stage-esp-boot.sh config of Wed Sep 16 15:02:37 UTC 2026.
# Entries [1] and [2] are devicetree boots of the same staged kernel; everything
# else (the ESP-only entry [0], the installed system's own config at [3], the
# diagnostics entry [4], Windows at [5]) is unchanged.
#
# Why a DT entry at all: the internal keyboard, touchpad, touchscreen and the
# ASUSTek HID device are ACPI "HID over I2C" slaves (PNP0C50) behind GENI I2C
# controllers the firmware declares as QCOM0F10.  No kernel's i2c-qcom-geni
# claims that ACPI ID (mainline 7.3.0-rc3's table is { QCOM0220, QCOM0411 } only)
# and pinctrl-glymur has no ACPI table at all, so under ACPI no i2c bus ever
# exists.  The same devices ARE described in the machine DTS, hence a DT boot.
#
# WHAT THE FIRST DT BOOT SHOWED (journal boot -1, 2026-09-16 12:36-12:39 EDT):
#   * the DT boot itself works: "Machine model: ASUS Zenbook A16 (UX3607OA)",
#     pinctrl_glymur/gcc_glymur/qnoc_glymur/i2c_qcom_geni load, four i2c buses
#     appear and all four internal HID devices register:
#        i2c-19 addr 0x15  0B05:4B42  Keyboard        (internal keyboard)
#        i2c-0  addr 0x15  093A:3012  Mouse+Touchpad  (hid-multitouch bound)
#        i2c-8  addr 0x10  04F3:4645  Touchscreen+Stylus
#        i2c-10 addr 0x17  0B05:4543  hidraw
#     and it reaches gdm/gnome-shell.
#   * the screen goes BLACK because msm binds afterwards and takes the display
#     from the firmware framebuffer: DP AUX/combo-PHY init trips a clk WARN
#     ("gcc_usb3_tert_phy_com_aux_clk status stuck at 'off'", "Failed to enable
#     clk 'com_aux': -16") inside panel_samsung_atna33xc20's probe, msm then owns
#     fb0 and gnome-shell selects it -- "GPU /dev/dri/card1 selected primary from
#     builtin panel presence" -- on a panel that was never lit.
#   The project's own live-time cmdline already carried the cure, so entry [1]
#   adds it:  module_blacklist=msm modprobe.blacklist=msm
#   With msm blacklisted nothing takes the framebuffer away, simpledrm keeps
#   driving the panel exactly as the ACPI boot does, and the internal inputs
#   (which have nothing to do with the display) work.
#   Entry [2] is the same DT boot WITHOUT that blacklist: it is known to leave
#   the panel dark, and is kept only for re-checking the msm/panel failure.
#
# WHAT THE SECOND DT BOOT SHOWED (journal boot -1, 2026-09-16 12:49:38-12:51:32):
#   * the blacklist worked: no msm, "fb0: simpledrmdrmfb", fbcon took the
#     console, gnome-shell logged "Added device '/dev/dri/card0' (simpledrm)"
#     and "Integrated GPU /dev/dri/card0 selected as primary", and all four
#     internal i2c-HID devices registered again -- i.e. the machine was fine.
#   * the panel still went dark because the DT declares the panel's rail as a
#     fixed regulator VREG_EDP_3P3 (machine DTS "regulator-edp", consumed as the
#     panel's power-supply) and, with the panel driver not bound (msm is
#     blacklisted, so no DP AUX -> no panel probe -> nobody claims the rail), the
#     regulator core's late cleanup turned it off:
#         Sep 16 12:51:19 kernel: VREG_EDP_3P3: disabling
#     That is the ONLY "disabling" line in the DT boot; the working ACPI boot has
#     none, because under ACPI Linux never registers that rail at all.
#   The knob is the third sibling of the two ignore flags already below --
#   drivers/regulator/core.c has __setup("regulator_ignore_unused") -- so entry
#   [1] now passes regulator_ignore_unused alongside clk_ignore_unused and
#   pd_ignore_unused.
#
# WHAT THE THIRD DT BOOT SHOWED (journal boot -1, 2026-09-16 ~12:57-13:00):
#   * all three flags took effect --
#         clk: Not disabling unused clocks
#         PM: genpd: Not disabling unused power domains
#         regulator: Not disabling unused regulators
#     no rail was cut, simpledrm kept fb0, fbcon took the console, no msm, all 20
#     internal i2c-HID input nodes registered, gnome-shell ran on /dev/dri/card0.
#   * the panel was STILL dark.  So it is a driver *touching* the panel pipeline,
#     not the unused-power cleanup.  The two boots otherwise have an identical
#     display software path (simpledrm on the firmware GOP framebuffer, fb0
#     2880x1800, gnome-shell on card0 -- verified in both logs, and the machine
#     DTS declares no framebuffer of its own).  What differs is ownership of the
#     hardware:
#         ACPI boot : binds none of it -- 0 i2c adapters, 0 gpiochips, no
#                     pinctrl-glymur, no gcc/qnoc/dispcc, no DT regulators; the
#                     panel pipeline stays exactly as firmware left it.
#         DT boot   : owns it all -- TLMM/gpiochip, gcc-glymur, qnoc-glymur,
#                     pmic_glink rails, and dispcc-glymur (the DISPLAY clock
#                     controller, which appears only here: "dispcc-glymur
#                     af00000.clock-controller: sync_state() pending due to
#                     ae00000.display-subsystem"; 0 hits under ACPI).
#   Entry [1] therefore blacklists the whole display pipeline -- msm, dispcc,
#   gpucc, videocc, the eDP PHY and the panel driver -- so nothing but firmware
#   (and simpledrm) touches the display, while the input path stays enabled:
#   pinctrl-glymur, gcc-glymur, qnoc-glymur, i2c_qcom_geni, i2c-hid.
#   If the panel is still dark, compare the stored state instead of guessing:
#   a16-boot-report.service writes clocks/regulators/GPIO/input state of every
#   boot to /boot/efi/a16-reports/<stamp>-<mode>/ (see 99-summary.txt).
#
# acpi=off is what makes the kernel use the DTB: arm64 prefers ACPI whenever the
# firmware offers tables.
set timeout=30
set timeout_style=menu
set default=0

insmod part_gpt
insmod fat
insmod ext2
insmod search_fs_file
insmod sleep
insmod fdt

# Snapdragon boards: Ubuntu's own arm64 config cuts a bogus high window out of
# the memory map before handing memory to the kernel.  (Unchanged.)
insmod smbios
insmod regexp
smbios --type 4 --get-string 5 --set proc_version
regexp "Snapdragon.*" "$proc_version"
if [ "$?" = "0" ]; then
  if [ "$lockdown" != "y" ]; then
    cutmem 0x8800000000 0x8fffffffff
  fi
fi

menuentry "[0] A16: installed Ubuntu - kernel and initrd staged on the ESP (ACPI)" {
    echo "  prefix=$prefix  cmdpath=$cmdpath"
    search --no-floppy --file --set=a16esp /a16boot/vmlinuz
    if [ -z "$a16esp" ]; then
        echo "  /a16boot/vmlinuz is not on any device -- staged payload missing"
    else
        echo "  staged payload is on $a16esp"
        set root=$a16esp
        set prefix="$a16esp/a16boot"
        insmod gzio
        linux /a16boot/vmlinuz root=UUID=f8e005e9-414c-4c8e-ad68-d1e9fdc208bc  ro  quiet splash crashkernel=2G-4G:320M,4G-32G:512M,32G-64G:1024M,64G-128G:2048M,128G-:4096M
        initrd /a16boot/initrd.img
        boot
    fi
    echo "  entry 0 did not boot"
}

menuentry "[1] A16: DT + internal input, panel left to firmware (display pipeline blacklisted)" {
    echo "  prefix=$prefix  cmdpath=$cmdpath"
    search --no-floppy --file --set=a16esp /a16boot/vmlinuz
    if [ -z "$a16esp" ]; then
        echo "  /a16boot/vmlinuz is not on any device -- staged payload missing"
    else
        echo "  staged payload is on $a16esp"
        set root=$a16esp
        set prefix="$a16esp/a16boot"
        if [ -f /a16boot/glymur-asus-zenbook-a16-ux3607oa.dtb ]; then
            echo "  DTB: /a16boot/glymur-asus-zenbook-a16-ux3607oa.dtb"
            insmod fdt
            insmod gzio
            linux /a16boot/vmlinuz root=UUID=f8e005e9-414c-4c8e-ad68-d1e9fdc208bc  ro  acpi=off clk_ignore_unused pd_ignore_unused regulator_ignore_unused module_blacklist=msm,dispcc_glymur,gpucc_glymur,videocc_glymur,phy_qcom_edp,panel_samsung_atna33xc20 modprobe.blacklist=msm console=tty0 keep_bootcon loglevel=7 crashkernel=2G-4G:320M,4G-32G:512M,32G-64G:1024M,64G-128G:2048M,128G-:4096M
            devicetree /a16boot/glymur-asus-zenbook-a16-ux3607oa.dtb
            initrd /a16boot/initrd.img
            boot
        else
            echo "  DTB MISSING: /a16boot/glymur-asus-zenbook-a16-ux3607oa.dtb"
            echo "  (run a16-stage-dt-boot.sh first)"
        fi
    fi
    echo "  entry 1 did not boot -- back to the menu in 20s"
    sleep 20
    configfile $prefix/grub.cfg
}

menuentry "[2] A16: DT with msm bound - SCREEN STAYS BLACK (msm/panel diagnosis only)" {
    echo "  prefix=$prefix  cmdpath=$cmdpath"
    echo "  internal input works on this one too, but the panel is dark - use the USB keyboard"
    search --no-floppy --file --set=a16esp /a16boot/vmlinuz
    if [ -n "$a16esp" ]; then
        set root=$a16esp
        set prefix="$a16esp/a16boot"
        if [ -f /a16boot/glymur-asus-zenbook-a16-ux3607oa.dtb ]; then
            insmod fdt
            insmod gzio
            linux /a16boot/vmlinuz root=UUID=f8e005e9-414c-4c8e-ad68-d1e9fdc208bc  ro  acpi=off clk_ignore_unused pd_ignore_unused console=tty0 keep_bootcon loglevel=7 crashkernel=2G-4G:320M,4G-32G:512M,32G-64G:1024M,64G-128G:2048M,128G-:4096M
            devicetree /a16boot/glymur-asus-zenbook-a16-ux3607oa.dtb
            initrd /a16boot/initrd.img
            boot
        fi
    fi
    echo "  entry 2 did not boot -- back to the menu in 20s"
    sleep 20
    configfile $prefix/grub.cfg
}

menuentry "[3] A16: installed Ubuntu - its own generated grub.cfg (normal path)" {
    echo "  prefix=$prefix  cmdpath=$cmdpath"
    search --no-floppy --fs-uuid --set=root f8e005e9-414c-4c8e-ad68-d1e9fdc208bc
    echo "  root=$root (want UUID f8e005e9-414c-4c8e-ad68-d1e9fdc208bc)"
    set prefix="($root)/boot/grub"
    configfile $prefix/grub.cfg
    echo "  could not read ($root)/boot/grub/grub.cfg"
}

menuentry "[4] A16: diagnostics - photograph this screen" {
    set pager=0
    echo "  === A16 GRUB diagnostics ==="
    echo "  prefix=$prefix"
    echo "  cmdpath=$cmdpath"
    echo "  platform=$grub_platform  cpu=$grub_cpu"
    search --no-floppy --file --set=a16esp /a16boot/vmlinuz
    echo "  staged payload found on: $a16esp"
    search --no-floppy --fs-uuid --set=r17 f8e005e9-414c-4c8e-ad68-d1e9fdc208bc
    echo "  UUID f8e005e9-414c-4c8e-ad68-d1e9fdc208bc -> $r17"
    echo "  --- staged ESP payload ---"
    ls ($a16esp)/a16boot
    echo "  --- installed root ---"
    if [ -f ($r17)/boot/vmlinuz-7.2.0-5-generic ]; then echo "    /boot/vmlinuz-7.2.0-5-generic: PRESENT"; else echo "    /boot/vmlinuz-7.2.0-5-generic: MISSING"; fi
    if [ -f ($r17)/boot/initrd.img-7.2.0-5-generic ]; then echo "    /boot/initrd.img-7.2.0-5-generic: PRESENT"; else echo "    /boot/initrd.img-7.2.0-5-generic: MISSING"; fi
    for m in gzio.mod ext2.mod linux.mod normal.mod fat.mod part_gpt.mod search.mod fdt.mod; do
        if [ -f ($r17)/boot/grub/arm64-efi/$m ]; then echo "    module $m: PRESENT"; else echo "    module $m: MISSING"; fi
    done
    ls ($r17)/boot
    echo "  === end: prefix=$prefix cmdpath=$cmdpath esp=$a16esp root=$r17 ==="
    echo "  (sleeping 90s - photograph now)"
    sleep 90
}

menuentry "[5] Windows Boot Manager" {
    insmod part_gpt
    insmod fat
    insmod chain
    search --no-floppy --file --set=root /EFI/Microsoft/Boot/bootmgfw.efi
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}
