# Use the ALSA UCM profile for the A16 sound card instead of the ACP legacy path.
# ACP offers this card no profile at all (it does not know the machine), which leaves
# PipeWire with nothing to build a sink from and the desktop showing "Dummy Output".
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.name = "~GLYMUR.*" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
        api.alsa.use-ucm = true
        session.suspend-timeout-seconds = 5
      }
    }
  }
]
